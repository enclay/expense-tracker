[tool.poetry]
name = "bot"
version = "0.1.0"
description = "Expense Tracker Bot"
authors = ["enclay <enclayff@gmail.com>"]

[tool.poetry.dependencies]
python = ">=3.11"
python-telegram-bot = "*"
python-dotenv = "*"
openai = "*"
requests = "*"

[tool.poetry.scripts]
start = "bot.main:main"
migrate = "scripts.migrate:apply_migrations"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
